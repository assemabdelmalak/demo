name: Docker

# Builds every image on every push and verifies it starts healthy and stays under 250 MB
# (DEPLOYMENT §2). Only the default branch pushes to GHCR, tagged sha-<7> and staging (ADR-010).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # A stable check name for branch protection.
    name: image (${{ matrix.app }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            port: 4000
            health: /v1/health/live
          - app: worker
            port: 4100
            health: /healthz
          - app: diner
            port: 3000
            health: /healthz
            sentry_project_var: SENTRY_PROJECT_DINER
          - app: console
            port: 3001
            health: /healthz
            sentry_project_var: SENTRY_PROJECT_CONSOLE
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/radd-menu-${{ matrix.app }}
      # Browser source maps go to Sentry for images that get pushed, once the owner adds the
      # SENTRY_AUTH_TOKEN secret (P0-T09). The Nest apps need none: --enable-source-maps maps
      # their stack traces before Sentry sees them.
      SENTRY_UPLOAD: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.sentry_project_var != '' && secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging,enable=${{ env.PUSH }}
      - name: Build (and load locally for verification)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          load: true
          tags: radd-menu-${{ matrix.app }}:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=0.0.0+${{ github.sha }}
            SENTRY_UPLOAD=${{ env.SENTRY_UPLOAD }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ matrix.sentry_project_var && vars[matrix.sentry_project_var] || '' }}
          secrets: ${{ env.SENTRY_UPLOAD == 'true' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Stays under 250 MB
        run: |
          size=$(docker image inspect --format '{{.Size}}' radd-menu-${{ matrix.app }}:ci)
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((250 * 1024 * 1024))
      - name: Runs as a non-root user
        run: test "$(docker image inspect --format '{{.Config.User}}' radd-menu-${{ matrix.app }}:ci)" = "node"
      - name: Starts and reports healthy
        run: |
          docker compose -f infra/docker-compose.dev.yml up -d --wait --wait-timeout 180 postgres valkey
          # docker --env-file takes values literally, so strip the comments .env.example carries.
          node -e "const {parseEnv}=require('node:util');const e=parseEnv(require('fs').readFileSync('.env.example','utf8'));require('fs').writeFileSync('ci.env',Object.entries(e).map(([k,v])=>k+'='+v).join('\n')+'\n')"
          docker run -d --name app --network host --env-file ci.env radd-menu-${{ matrix.app }}:ci
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:${{ matrix.port }}${{ matrix.health }}" > /dev/null; then echo healthy; exit 0; fi
            sleep 1
          done
          docker logs app; exit 1
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=0.0.0+${{ github.sha }}
            SENTRY_UPLOAD=${{ env.SENTRY_UPLOAD }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ matrix.sentry_project_var && vars[matrix.sentry_project_var] || '' }}
          secrets: ${{ env.SENTRY_UPLOAD == 'true' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
