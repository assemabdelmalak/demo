name: CodeQL

# Static analysis for JavaScript/TypeScript (SEC §2): pull requests, the default branch and nightly
# (TESTING §6.9), so new queries catch code already on master.
on:
  pull_request:
  push:
    # Branch filters cannot use expressions; both names keep this working if master is renamed (ADR-010).
    branches: [master, main]
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/.next'
              - packages/api-client/src/generated
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
      # Agent sessions cannot read code-scanning alerts through the API, only job logs, so a red
      # CodeQL check could not be acted on. List every result (rule, level, place, message) here.
      - name: List results in the log
        if: always()
        run: |
          for f in ../results/*.sarif; do
            [ -f "$f" ] || continue
            jq -r '.runs[].results[]
              | "\(.ruleId) [\(.level // "warning")] \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text | gsub("\n"; " "))"' "$f"
          done
