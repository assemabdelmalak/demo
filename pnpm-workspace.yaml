packages:
  - apps/*
  - packages/*

# pnpm 10 skips dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - lefthook
ignoredBuiltDependencies:
  # Prebuilt binaries ship as optional dependencies; the postinstall is only a fallback.
  - unrs-resolver

overrides:
  # TypeScript 7 (native) has no compiler API; typescript-eslint and openapi-typescript need 5.x. See ADR-011.
  typescript: 5.9.3

peerDependencyRules:
  allowedVersions:
    # Declares eslint <=9 but runs cleanly on ESLint 10 (checked 2026-10-20). See ADR-011.
    eslint-plugin-jsx-a11y>eslint: '10'
