packages:
  - apps/*
  - packages/*

# pnpm 10 skips dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - lefthook
ignoredBuiltDependencies:
  # Prebuilt binaries ship as optional dependencies; their postinstall is only a fallback.
  - '@swc/core'
  - unrs-resolver
  # Optional native speed-ups of the Docker client used by Testcontainers (SSH transport only).
  - cpu-features
  - ssh2
  - '@parcel/watcher'
  - msgpackr-extract
  # Postinstall only prints a version notice.
  - protobufjs
  # Install-time analytics ping (pulled in by @nestjs/swagger); never run it.
  - '@scarf/scarf'

overrides:
  # TypeScript 7 (native) has no compiler API; typescript-eslint and openapi-typescript need 5.x. See ADR-011.
  typescript: 5.9.3

peerDependencyRules:
  allowedVersions:
    # Declares eslint <=9 but runs cleanly on ESLint 10 (checked 2026-10-20). See ADR-011.
    eslint-plugin-jsx-a11y>eslint: '10'
